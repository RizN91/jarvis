# Publishes site/ to GitHub Pages.
#
# Why Actions rather than a branch folder: the Pages API only accepts "/" or
# "/docs" as a branch source, and "/docs" would publish the internal audit
# notes, raw test logs and codex captures that live there. Uploading site/ as an
# artifact keeps the page and the notes separate.

name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
