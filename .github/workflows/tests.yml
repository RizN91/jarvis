name: tests

# Runs the HEADLESS-SAFE subset of the suite on Windows.
#
# Deliberately NOT run here: test_overlay.py, test_chromium_field.py,
# test_insert_integration.py (they need a real interactive desktop, a real
# layered window and a real WebView2 surface), and the three suites that call the
# paid OpenAI API. Those are documented in CONTRIBUTING.md and are run locally.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyflakes

      - name: Byte-compile everything
        run: python -m compileall -q jarvis tests

      - name: No undefined names
        run: |
          python -m pyflakes jarvis
          if ($LASTEXITCODE -ne 0) {
            $out = python -m pyflakes jarvis 2>&1 | Out-String
            if ($out -match "undefined name|invalid syntax") {
              Write-Error "pyflakes found undefined names or syntax errors"
              exit 1
            }
            Write-Host "only unused-import style findings (not fatal):"
            Write-Host $out
          }

      - name: JavaScript syntax
        run: node --check jarvis/ui/web/app.js

      - name: Offline logic suites
        shell: bash
        run: |
          set -e
          for t in test_core_units test_regressions test_codex_audit test_silence_guard test_scripts; do
            echo "########## $t ##########"
            python -u "tests/$t.py"
          done

      - name: Upload any failing output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-py${{ matrix.python-version }}
          path: |
            docs/TEST_RESULTS_raw.txt
          if-no-files-found: ignore
